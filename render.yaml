services:
  - type: web
    name: localmutfak-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: localmutfak-db
          property: connectionString

databases:
  - name: localmutfak-db
    plan: basic-256mb
    databaseName: localmutfak
    user: localmutfak
